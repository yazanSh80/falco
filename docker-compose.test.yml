version: '3.8'
services:
  db-test:
    image: mysql:8.0
    container_name: falco-db-test
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_USER: falco
      MYSQL_PASSWORD: falco_secret
      MYSQL_DATABASE: Graduation_test
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u falco -pfalco_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
